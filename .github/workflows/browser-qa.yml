name: Card wallet browser QA
on:
  push:
    branches: [main, feature/email-password-cloud, fix/cloud-conflicts-and-status, fix/magic-link-fallback, fix/telegram-private-test]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 qrcode@1.5.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Existing wallet end-to-end tests
        run: node tests/e2e.cjs
      - name: Backup and restore end-to-end tests
        run: node tests/backup-e2e.cjs
      - name: Automatic local recovery regression
        run: node tests/local-recovery-e2e.cjs
      - name: Code integrity and editing tests
        run: node tests/quality-e2e.cjs
      - name: Same-store QR identity regression
        run: node tests/identity-e2e.cjs
      - name: Full retailer recognition and photo tests
        run: node tests/brand-e2e.cjs
      - name: Email-code, account isolation and offline sync regression
        run: node tests/password-cloud-e2e.cjs
      - name: OTP delivery messaging and errors
        run: node tests/otp-delivery-e2e.cjs
      - name: Magic-link fallback login
        run: node tests/magic-link-e2e.cjs
      - name: Cloud conflicts, pending state and quota recovery
        run: node tests/cloud-conflict-e2e.cjs
      - name: Atomic two-device revision and deletion regression
        run: node tests/atomic-sync.cjs
      - name: Telegram authentication, privacy and payment shutdown
        run: node tests/telegram-private-test.cjs
      - name: Telegram Mini App browser flow
        run: node tests/telegram-browser-e2e.cjs
      - name: Telegram quick mode, open history and compact layout
        run: node tests/telegram-quick-mode.cjs
      - name: Telegram account isolation and cross-device open sync
        run: node tests/telegram-account-privacy.cjs
      - name: Bot branding script against a fake Bot API
        run: node tests/telegram-apply-script.cjs
      - name: Welcome animation integrity and real motion
        run: node tests/branding-animation.cjs
      - name: Telegram bot onboarding and navigation
        run: node tests/telegram-onboarding.cjs
      - name: Community tab, Premium gate and owner consent
        run: node tests/community-ui.cjs

  community-sql:
    # Честность ротации, атомарность и RLS проверяются на настоящем PostgreSQL:
    # на моках такие свойства подтвердить нельзя.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Community rules, fair rotation and RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database kartochka_cc'
          psql -h localhost -U postgres -d kartochka_cc -v ON_ERROR_STOP=1 \
               -f tests/sql/community-cards-check.sql
      - name: Card open history rules
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c 'create database kartochka_open'
          psql -h localhost -U postgres -d kartochka_open -v ON_ERROR_STOP=1 \
               -f tests/sql/open-history-check.sql
