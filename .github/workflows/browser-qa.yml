name: Card wallet browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 qrcode@1.5.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: node tests/e2e.cjs
