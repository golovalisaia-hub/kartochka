name: Card wallet browser QA
on:
  push:
    branches: [main, feature/email-password-cloud, fix/cloud-conflicts-and-status]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock playwright@1.55.0 qrcode@1.5.4
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Existing wallet end-to-end tests
        run: node tests/e2e.cjs
      - name: Backup and restore end-to-end tests
        run: node tests/backup-e2e.cjs
      - name: Code integrity and editing tests
        run: node tests/quality-e2e.cjs
      - name: Same-store QR identity regression
        run: node tests/identity-e2e.cjs
      - name: Full retailer recognition and photo tests
        run: node tests/brand-e2e.cjs
      - name: Email-code, account isolation and offline sync regression
        run: node tests/password-cloud-e2e.cjs
      - name: Cloud conflicts, pending state and quota recovery
        run: node tests/cloud-conflict-e2e.cjs
      - name: Atomic two-device revision and deletion regression
        run: node tests/atomic-sync.cjs
