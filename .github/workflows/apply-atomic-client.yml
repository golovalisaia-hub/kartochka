name: Apply atomic client integration
on:
  push:
    branches: [feature/atomic-client-sync]
    paths: [scripts/apply-atomic-client.cjs]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply anchored integration patches
        run: node scripts/apply-atomic-client.cjs
      - name: Check JavaScript syntax
        run: |
          node --check cloud-atomic.js
          node --check app.js
          node --check tests/password-cloud-e2e.cjs
          node --check tests/cloud-conflict-e2e.cjs
      - name: Commit generated source changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js tests/password-cloud-e2e.cjs tests/cloud-conflict-e2e.cjs
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Wire atomic card RPC and tombstone sync into wallet"
          git push origin HEAD:feature/atomic-client-sync
